# /etc/nginx/sites-available/jencorps.conf
# One deployment serves jencorps.com, www.jencorps.com and every *.jencorps.com influencer subdomain.
# Requires a wildcard certificate covering jencorps.com and *.jencorps.com (see README: Wildcard SSL).

upstream jencorps_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

# HTTP -> HTTPS for every host
server {
    listen 80;
    listen [::]:80;
    server_name jencorps.com *.jencorps.com;
    return 301 https://$host$request_uri;
}

# www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.jencorps.com;
    ssl_certificate     /etc/letsencrypt/live/jencorps.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jencorps.com/privkey.pem;
    return 301 https://jencorps.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # Apex + any single-label subdomain (arun.jencorps.com, priya.jencorps.com, ...)
    server_name jencorps.com ~^(?<sub>[a-z0-9-]+)\.jencorps\.com$;

    ssl_certificate     /etc/letsencrypt/live/jencorps.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jencorps.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 100m;   # marketing videos
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API (same origin on every host => first-party cookies, no CORS)
    location /api/ {
        proxy_pass http://jencorps_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # The API validates this host against BASE_DOMAIN to resolve the influencer
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Locally stored uploads (only needed when Cloudinary is not configured)
    location /uploads/ {
        proxy_pass http://jencorps_api;
        proxy_set_header Host $host;
        expires 7d;
    }

    # React SPA (built with `npm run build`)
    root /var/www/jencorps/frontend/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
